name: Documentation and contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python3 scripts/validate_docs.py
      - run: python3 -m pip install -r scripts/requirements-docs.txt
      - run: python3 scripts/validate_contracts.py
      - run: python3 scripts/validate_semantics.py

      - run: python3 scripts/validate_seo_contract.py
      - run: python3 scripts/validate_icons.py
