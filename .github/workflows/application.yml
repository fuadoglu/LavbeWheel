name: Application foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lavbe_api_test
          MYSQL_ROOT_PASSWORD: lavbe-test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plavbe-test-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      LAVBE_TEST_DATABASE_DSN: mysql:host=127.0.0.1;port=3306;dbname=lavbe_api_test;charset=utf8mb4
      LAVBE_TEST_DATABASE_USER: root
      LAVBE_TEST_DATABASE_PASSWORD: lavbe-test-root-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_mysql, sodium
          tools: composer:v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python3 -m pip install -r scripts/requirements-docs.txt
      - run: npm run validate:docs
      - run: npm run check
      - run: npm run test:unit
      - run: composer install --working-dir=apps/api --no-interaction --prefer-dist
      - run: npm run test:api
      - run: npm run test:content
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:a11y
      - run: npm run test:seo
      - run: npm run test:pwa
      - run: npm run test:consent
      - run: npm audit --audit-level=moderate
